{% extends "base.html" %}
{% block title %}Users - GemPundit{% endblock %}
{% block content %}<div class="space-y-6"><div class="flex justify-between"><h1 class="text-2xl font-bold">Users</h1><a class="btn btn-primary" href="{{ url_for('main.create_user') }}">Create User</a></div><div class="card overflow-x-auto"><table class="min-w-full"><thead><tr class="border-b"><th class="px-4 py-3 text-left">Username</th><th class="px-4 py-3 text-left">Email</th><th class="px-4 py-3 text-left">Role</th><th class="px-4 py-3 text-left">Status</th><th class="px-4 py-3 text-left">Actions</th></tr></thead><tbody>{% for user in users %}<tr class="border-b"><td class="px-4 py-3">{{ user.username }}</td><td class="px-4 py-3">{{ user.email }}</td><td class="px-4 py-3">{{ user.role }}</td><td class="px-4 py-3">{{ 'Active' if user.is_active else 'Inactive' }}</td><td class="px-4 py-3"><form method="post" action="{{ url_for('main.toggle_user_status', user_id=user.id) }}" onsubmit="return confirm('{{ 'Deactivate' if user.is_active else 'Activate' }} {{ user.username }}?');"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-outline text-sm">{{ 'Deactivate' if user.is_active else 'Activate' }}</button></form></td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
