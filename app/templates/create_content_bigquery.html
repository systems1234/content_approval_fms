{% extends "base.html" %}
{% block title %}Create Content - GemPundit{% endblock %}
{% block content %}<div class="max-w-3xl mx-auto"><div class="card"><div class="card-body"><h1 class="text-2xl font-bold mb-6">Create Content Workflow Event</h1><form method="post" enctype="multipart/form-data" class="space-y-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input name="unique_key" required class="form-input w-full" placeholder="Unique_Key"><select name="stage" class="form-input w-full"><option>Seed_File</option><option>Content_Planning</option><option>Content_Creation</option></select><input name="primary_key" class="form-input w-full" placeholder="Primary_Key"><input name="category" class="form-input w-full" placeholder="Category"><input name="step_code" class="form-input w-full" placeholder="Step_Code"><input name="planned_date" type="datetime-local" class="form-input w-full"><input name="search_volume" type="number" class="form-input w-full" placeholder="Search volume"><input name="url" type="url" class="form-input w-full" placeholder="URL"><input name="gemstone_type" class="form-input w-full" placeholder="Gemstone type"><textarea name="tab_content" class="form-input w-full" placeholder="Content or planning notes"></textarea><input name="words_count" type="number" class="form-input w-full" placeholder="Words count"><input name="upload" type="file" accept=".pdf,.doc,.docx" class="form-input w-full"><button class="btn btn-primary">Create Event</button></form></div></div></div>{% endblock %}
